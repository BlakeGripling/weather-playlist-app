<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather Playlist App</title>
  <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.10/css/weather-icons.min.css"
/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.10.2/lottie.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="animated-clouds">
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
    <div class="cloud cloud4"></div>
    <div class="cloud cloud5"></div>
    <div class="cloud cloud6"></div>
  </div>
  <div class="wrapper">
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Enter city name...">
      <button id="search-btn" class="neon-button">Search</button>
    </div>
    <div class="weather-scroll" id="weather-scroll">
      <!-- Weather cards will be appended here -->
    </div>
  </div>
  <div class="spotify-embed">
    <iframe
      id="spotify-frame"
      style="border-radius:12px; background: rgba(0,0,0,0.4);"
      width="300"
      height="80"
      frameborder="0"
      allowtransparency="true"
      allow="encrypted-media">
    </iframe>
  </div>
  <script src="script.js"></script>
</body>
</html>
